# Builds the mod on every push / pull request (the jar is attached to the workflow run),
# and publishes a release for a version tag like 1.0.1 or v1.0.1.
#
# Two ways to release:
#   a) Create a tag and push it (IntelliJ: Git > New Tag..., then Git > Push with "Push tags" ticked).
#      Pushing the tag starts the release by itself.
#   b) On GitHub: Actions > "Build & Publish" > Run workflow, type an existing tag (e.g. 1.0.0) and run.
#      Useful to (re)release a tag that is already on GitHub.
#
# A release:
#   - builds the jar with the version taken from the tag (v1.0.1 / 1.0.1 -> 1.0.1)
#   - writes a changelog from the commit messages since the previous version tag
#     (commits containing "[skip changelog]" are left out; an annotated tag's message is put on top)
#   - uploads the jar to CurseForge and creates a GitHub Release with the same changelog
#
# Tags with "alpha" or "beta" in them (1.1.0-beta.1) are uploaded to CurseForge as alpha/beta files.
#
# One-time setup in the GitHub repo (Settings -> Secrets and variables -> Actions):
#   Secret    CURSEFORGE_TOKEN       - API token from https://legacy.curseforge.com/account/api-tokens
#   Variable  CURSEFORGE_PROJECT_ID  - the "Project ID" shown on your CurseForge project page (right sidebar)

name: Build & Publish

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release this existing tag (e.g. 1.0.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write # needed to create GitHub Releases

env:
  # the tag being released: typed in when run by hand, or the pushed tag; empty for normal builds
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ env.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
            VERSION="${BASE}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="${{ steps.version.outputs.version }}" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ftb-ultimine-shape-editor-${{ steps.version.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_tag }}
          fetch-depth: 0 # full history + tags, for the changelog

      - uses: actions/download-artifact@v4
        with:
          name: ftb-ultimine-shape-editor-${{ needs.build.outputs.version }}
          path: dist

      - name: Write changelog
        id: changelog
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --match '[0-9]*' "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}$TAG"

          {
            # an annotated tag's message goes on top
            if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
              git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP/,$d'
              echo
            fi

            echo "### Changes"
            CHANGES=$(git log "$RANGE" --no-merges --pretty='format:- %s' | grep -vi '\[skip changelog\]' || true)
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- Minor fixes and improvements"; fi

            if [ -n "$PREV" ]; then
              echo
              echo "Full list: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > CHANGELOG_RELEASE.md

          cat CHANGELOG_RELEASE.md
          {
            echo 'text<<CHANGELOG_EOF'
            cat CHANGELOG_RELEASE.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge and GitHub Releases
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.build.outputs.release_tag }}

          files: dist/*.jar
          name: FTB Ultimine Shape Editor ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          changelog: ${{ steps.changelog.outputs.text }}

          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            ftb-ultimine-forge(required){curseforge:ftb-ultimine-forge}