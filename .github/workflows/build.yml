  plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    // CurseForge uploads (same plugin FTB uses for their 26.1 releases)
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
  }
    
    version = mod_version
    group = mod_group_id
    
    base {
    archivesName = 'ftb-ultimine-shape-editor-neoforge-26.1'
  }
    
    // Minecraft 26.1 needs Java 25
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    
    repositories {
    maven {
    name = 'FTB'
    url = 'https://maven.ftb.dev/releases'
    content { includeGroup 'dev.ftb.mods' }
    }
  }
    
    neoForge {
    version = project.neo_version

    // Minecraft 26.1 is shipped without obfuscation, so no Parchment mappings are needed.

    runs {
    client {
    client()
    }
    server {
    server()
    programArgument '--nogui'
    }
    }

    mods {
    "${mod_id}" {
    sourceSet(sourceSets.main)
    }
    }
  }
    
    dependencies {
    // FTB Ultimine and the library it needs at runtime (needed in the dev client too)
    implementation "dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}"
    implementation "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
  }
    
    var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
  minecraft_version         : minecraft_version,
  minecraft_version_range   : minecraft_version_range,
  neo_version               : neo_version,
  neo_version_range         : neo_version_range,
  loader_version_range      : loader_version_range,
  ftb_ultimine_version_range: ftb_ultimine_version_range,
  mod_id                    : mod_id,
  mod_name                  : mod_name,
  mod_license               : mod_license,
  mod_version               : mod_version,
  mod_authors               : mod_authors,
  mod_repo_url              : mod_repo_url,
  mod_description           : mod_description
  ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
  }
    sourceSets.main.resources.srcDir generateModMetadata
    neoForge.ideSyncTask generateModMetadata
    
    tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  // CurseForge upload, used by the release workflow: ./gradlew publishMods
    // Needs the env vars CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID (and optionally CHANGELOG);
    // without a token it only does a dry run.
    publishMods {
    dryRun = providers.environmentVariable("CURSEFORGE_TOKEN").getOrNull() == null
    file = tasks.named('jar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${project.version} (MC 26.1)"
    version = "${project.version}+mc26.1"
    changelog = providers.environmentVariable("CHANGELOG").orElse("See the GitHub release for changes.")
    def v = project.version.toString()
  type = v.contains("alpha") ? ALPHA : (v.contains("beta") ? BETA : STABLE)
    modLoaders.add("neoforge")

    curseforge {
    accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
    projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID").orElse("0")
    supported_minecraft_versions.split(",").each { minecraftVersions.add(it.trim()) }
    javaVersions.add(JavaVersion.VERSION_25)
  // CurseForge's "Environment" group: the mod must be installed on both client and server
    clientRequired = true
    serverRequired = true
    requires("ftb-ultimine-forge")
  }
  }